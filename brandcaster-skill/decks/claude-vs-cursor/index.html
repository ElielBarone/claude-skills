<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude vs. Cursor — Deck Browser</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;900&display=swap');
    :root {
      --color-primary: #FFCC29; --color-secondary-dark: #2A3E49; --color-secondary: #4E5A62;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Montserrat', sans-serif; background: #1a2a35; color: white; min-height: 100vh; padding: 48px 56px; }

    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 48px; border-bottom: 2px solid rgba(255,204,41,0.2); padding-bottom: 32px; }
    .deck-title { font-size: 36px; font-weight: 700; color: white; }
    .deck-subtitle { font-size: 18px; color: #7a9aaa; margin-top: 6px; }
    .logo { width: 140px; opacity: 0.9; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 28px; }

    .slide-card { background: #243240; border-radius: 14px; overflow: hidden; border: 2px solid rgba(255,255,255,0.06); transition: transform 0.18s, border-color 0.18s, box-shadow 0.18s; cursor: pointer; text-decoration: none; display: block; }
    .slide-card:hover { transform: translateY(-4px); border-color: rgba(255,204,41,0.5); box-shadow: 0 8px 32px rgba(255,204,41,0.12); }

    .thumb-wrap { position: relative; width: 100%; padding-top: 56.25%; background: #1a2a35; overflow: hidden; }
    .thumb-wrap iframe { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; transform-origin: top left; border: none; pointer-events: none; }

    .card-info { padding: 20px 24px; }
    .slide-num { font-size: 13px; font-weight: 700; color: var(--color-primary); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; }
    .slide-name { font-size: 19px; font-weight: 700; color: white; }
    .open-btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; padding: 8px 20px; background: var(--color-primary); color: var(--color-secondary-dark); border-radius: 8px; font-size: 14px; font-weight: 700; text-decoration: none; }
    .open-btn:hover { background: #ECB236; }

    footer { margin-top: 56px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.08); color: #4a6070; font-size: 14px; text-align: center; }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="deck-title">Claude vs. Cursor</div>
      <div class="deck-subtitle">7 slides · Pros, Cons, Pricing &amp; Conclusion</div>
    </div>
    <div class="logo">
      <svg viewBox="0 0 163.23845 50.792717" xmlns="http://www.w3.org/2000/svg">
        <g transform="translate(-10.463734,-95.84864)">
          <path style="fill:#ffcc29;" d="m 173.70219,95.848641 a 25.39641,25.39641 0 0 0 -25.39636,25.396349 25.39641,25.39641 0 0 0 25.39636,25.39637 v -13.21791 a 12.178395,12.178395 0 0 1 -12.17846,-12.17846 12.178395,12.178395 0 0 1 12.17846,-12.17845 z m -38.1126,0.66683 h 13.21791 a 25.39641,25.39641 0 0 1 -25.39636,25.396359 v -13.2179 a 12.178395,12.178395 0 0 0 12.17845,-12.178459 z"/>
          <text style="font-weight:900;font-size:21.1667px;font-family:Montserrat;fill:white;" x="8.5375729" y="140.61708"><tspan style="font-weight:500;">brand</tspan>caster</text>
        </g>
      </svg>
    </div>
  </header>

  <div class="grid" id="grid"></div>

  <footer>Generated by BrandCaster · Claude vs. Cursor deck · 7 slides</footer>

  <script>
    const slides = [
      { file: 'slide-01.html', num: '01', name: 'Cover — Claude vs. Cursor' },
      { file: 'slide-02.html', num: '02', name: 'What Are We Comparing?' },
      { file: 'slide-03.html', num: '03', name: 'Claude: Key Strengths' },
      { file: 'slide-04.html', num: '04', name: 'Cursor: Key Strengths' },
      { file: 'slide-05.html', num: '05', name: 'Pricing Comparison' },
      { file: 'slide-06.html', num: '06', name: 'Pros & Cons at a Glance' },
      { file: 'slide-07.html', num: '07', name: 'Conclusion' },
    ];

    const grid = document.getElementById('grid');
    const containerW = 380; // approx card width
    const scale = containerW / 1920;

    slides.forEach(s => {
      const card = document.createElement('a');
      card.className = 'slide-card';
      card.href = s.file;
      card.target = '_blank';

      const thumbWrap = document.createElement('div');
      thumbWrap.className = 'thumb-wrap';

      const iframe = document.createElement('iframe');
      iframe.src = s.file;
      iframe.title = s.name;
      iframe.loading = 'lazy';

      // Scale the iframe to fit the thumbnail wrapper
      thumbWrap.addEventListener('load', () => {}, { once: true });

      const applyScale = () => {
        const w = thumbWrap.offsetWidth;
        const s2 = w / 1920;
        iframe.style.transform = `scale(${s2})`;
        iframe.style.height = (1080 * (1 / s2)) + 'px';
      };

      iframe.addEventListener('load', applyScale);
      window.addEventListener('resize', applyScale);
      setTimeout(applyScale, 200);

      thumbWrap.appendChild(iframe);

      const info = document.createElement('div');
      info.className = 'card-info';
      info.innerHTML = `
        <div class="slide-num">Slide ${s.num}</div>
        <div class="slide-name">${s.name}</div>
        <a class="open-btn" href="${s.file}" target="_blank">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          Open
        </a>`;

      card.appendChild(thumbWrap);
      card.appendChild(info);
      grid.appendChild(card);
    });
  </script>
</body>
</html>
